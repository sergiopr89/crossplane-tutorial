apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xbasicapps.example.com
spec:
  scope: Cluster
  group: example.com
  names:
    kind: XBasicApp
    plural: xbasicapps
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              instanceType:
                type: string
                default: t3.micro
              region:
                type: string
                default: us-east-1
              ami:
                type: string
                default: ami-dummy
            required: []
